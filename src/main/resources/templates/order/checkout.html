<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Thanh toán - Aura</title>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>
<div th:replace="~{layout/header :: header}"></div>

<div class="container checkout-page">
    <h1 style="font-size: 1.6rem; font-weight: 700; margin-bottom: 32px;">💳 Thanh toán đơn hàng</h1>

    <!-- Error Message -->
    <div class="alert alert-error" th:if="${error}" th:text="${error}"></div>

    <div class="checkout-layout">
        <!-- Checkout Form -->
        <form th:action="@{/checkout}" method="post">
            <div class="filter-card">
                <h3>📋 Thông tin nhận hàng</h3>

                <div class="form-group">
                    <label>Họ và tên người nhận *</label>
                    <input type="text" class="form-control" name="fullname" th:value="${orderDTO.fullname}" placeholder="Nguyễn Văn A" required/>
                </div>

                <div class="form-group">
                    <label>Số điện thoại *</label>
                    <input type="tel" class="form-control" name="phone" th:value="${orderDTO.phone}" placeholder="0912.345.678" required/>
                </div>

                <div class="form-group">
                    <label>Email</label>
                    <input type="email" class="form-control" name="email" th:value="${orderDTO.email}" placeholder="email@example.com"/>
                </div>

                <div class="form-group">
                    <label>Địa chỉ nhận hàng *</label>
                    <input type="text" class="form-control" name="address" th:value="${orderDTO.address}" placeholder="123 Đường ABC, Quận XYZ, TP.HCM" required/>
                </div>

                <div class="form-group">
                    <label>Ghi chú giao hàng</label>
                    <textarea class="form-control" name="note" th:text="${orderDTO.note}" placeholder="Ví dụ: Gọi trước khi giao, giao giờ hành chính..."></textarea>
                </div>
            </div>

            <!-- Payment Methods Section -->
            <div class="filter-card" style="margin-top: 24px;">
                <div class="payment-section-title">
                    <h3 style="margin: 0;">💳 Phương thức thanh toán</h3>
                    <span style="font-size: 0.8rem; color: var(--text-muted);">An toàn & Bảo mật 100%</span>
                </div>
                <p style="color: var(--text-secondary); font-size: 0.84rem; margin-top: 4px; margin-bottom: 16px;">
                    Vui lòng lựa chọn phương thức thanh toán phù hợp:
                </p>

                <div class="payment-card-list">
                    <!-- Option 1: COD -->
                    <label class="payment-card active">
                        <div class="payment-card-header">
                            <div class="payment-radio-wrap">
                                <input type="radio" name="paymentMethod" value="COD" checked/>
                            </div>
                            <div class="payment-card-icon" style="color: var(--neon-green);">💵</div>
                            <div class="payment-card-body">
                                <div class="payment-card-title">
                                    <span>Thanh toán khi nhận hàng (COD)</span>
                                    <span class="payment-badge badge-popular">Phổ biến nhất</span>
                                </div>
                                <div class="payment-card-subtitle">
                                    Nhận hàng, kiểm tra sản phẩm chính hãng trước khi thanh toán tiền mặt cho shipper.
                                </div>
                            </div>
                        </div>
                        <div class="payment-subpanel" data-for="COD" style="display: block;">
                            <div style="display: flex; flex-direction: column; gap: 6px;">
                                <div>✓ <strong>Đồng kiểm hàng:</strong> Bạn được mở hộp kiểm tra ngoại quan sản phẩm trước khi thanh toán.</div>
                                <div>✓ <strong>Miễn phí vận chuyển:</strong> Áp dụng cho toàn bộ đơn hàng gaming gear tại Aura.</div>
                                <div>💡 <em>Lưu ý:</em> Vui lòng chuẩn bị sẵn số tiền mặt tương ứng để việc nhận hàng diễn ra thuận tiện nhất.</div>
                            </div>
                        </div>
                    </label>

                    <!-- Option 2: VietQR / Bank Transfer -->
                    <label class="payment-card">
                        <div class="payment-card-header">
                            <div class="payment-radio-wrap">
                                <input type="radio" name="paymentMethod" value="BANK_TRANSFER"/>
                            </div>
                            <div class="payment-card-icon" style="color: var(--neon-cyan);">🏦</div>
                            <div class="payment-card-body">
                                <div class="payment-card-title">
                                    <span>Chuyển khoản Ngân hàng (24/7)</span>
                                    <span class="payment-badge badge-recommended">Khuyên dùng</span>
                                </div>
                                <div class="payment-card-subtitle">
                                    Chuyển khoản nhanh 24/7 từ bất kỳ ứng dụng ngân hàng nào (MB, VCB, TCB, VPB...).
                                </div>
                            </div>
                        </div>
                        <div class="payment-subpanel" data-for="BANK_TRANSFER" style="display: none;"><p>Mã VietQR và thông tin chuyển khoản đúng theo đơn hàng sẽ hiển thị sau khi bạn xác nhận đặt hàng. Vui lòng chỉ chuyển tiền theo thông tin trên trang thanh toán.</p></div>
                    </label>

                </div>
            </div>

            <button type="submit" class="btn btn-primary btn-lg btn-block" style="margin-top: 24px; padding: 16px; font-size: 1.05rem; font-weight: 700; box-shadow: 0 4px 20px rgba(6, 182, 212, 0.35);">
                ✅ Xác nhận đặt hàng
            </button>
        </form>

        <!-- Order Summary -->
        <div class="cart-summary">
            <h2>📦 Đơn hàng của bạn</h2>

            <div th:each="item : ${cartItems}" style="display: flex; gap: 12px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--border-subtle);">
                <div style="width: 50px; height: 50px; border-radius: 8px; overflow: hidden; background: var(--bg-tertiary); flex-shrink: 0;">
                    <img th:src="${item.thumbnail}" th:alt="${item.productTitle}" style="width: 100%; height: 100%; object-fit: cover;" onerror="this.style.display='none'"/>
                </div>
                <div style="flex: 1; min-width: 0;">
                    <div style="font-size: 0.82rem; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;" th:text="${item.productTitle}">Sản phẩm</div>
                    <div style="font-size: 0.78rem; color: var(--text-muted);">x<span th:text="${item.quantity}">1</span></div>
                </div>
                <div style="font-weight: 600; font-size: 0.88rem; white-space: nowrap;" th:text="${#numbers.formatInteger(item.subtotal, 0, 'POINT')} + ' ₫'">1.290.000 ₫</div>
            </div>

            <div class="cart-summary-row" style="margin-top: 12px;">
                <span>Tạm tính</span>
                <span th:text="${#numbers.formatInteger(totalAmount, 0, 'POINT')} + ' ₫'">3.870.000 ₫</span>
            </div>
            <div class="cart-summary-row">
                <span>Phí vận chuyển</span>
                <span style="color: var(--neon-green);">Miễn phí</span>
            </div>
            <div class="cart-summary-row total">
                <span>Tổng thanh toán</span>
                <span class="amount" th:text="${#numbers.formatInteger(totalAmount, 0, 'POINT')} + ' ₫'">3.870.000 ₫</span>
            </div>
        </div>
    </div>
</div>

<div th:replace="~{layout/footer :: footer}"></div>
<script th:src="@{/js/main.js}"></script>
</body>
</html>
