<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Đăng ký tài khoản - Aura</title>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>

<div class="auth-page">
    <div class="auth-card">
        <!-- Logo -->
        <div style="text-align: center; margin-bottom: 20px;">
            <a href="/" class="logo" style="justify-content: center;">
                <img th:src="@{/images/logo.svg}" alt="Aura" style="width: 36px; height: 36px;"/>
                <span>Au<span style="color: var(--neon-cyan);">ra</span></span>
            </a>
        </div>

        <h1>Tạo tài khoản mới</h1>
        <p class="auth-subtitle">Đăng ký để bắt đầu mua sắm thiết bị điện tử chính hãng</p>

        <!-- Error Message -->
        <div class="alert alert-error" th:if="${error}" th:text="${error}"></div>

        <form th:action="@{/register}" method="post">
            <div class="form-group">
                <label>Họ và tên</label>
                <input type="text" class="form-control" name="fullname" th:value="${registerDTO.fullname}" placeholder="Nguyễn Văn A" required/>
            </div>

            <div class="form-group">
                <label>Tên đăng nhập *</label>
                <input type="text" class="form-control" name="username" th:value="${registerDTO.username}" placeholder="username123" required minlength="3"/>
            </div>

            <div class="form-group">
                <label>Email</label>
                <input type="email" class="form-control" name="email" th:value="${registerDTO.email}" placeholder="email@example.com"/>
            </div>

            <div class="form-group">
                <label>Mật khẩu * (tối thiểu 6 ký tự)</label>
                <input type="password" class="form-control" name="password" placeholder="••••••••" required minlength="6"/>
            </div>

            <div class="form-group">
                <label>Xác nhận mật khẩu *</label>
                <input type="password" class="form-control" name="confirmPassword" placeholder="••••••••" required minlength="6"/>
            </div>

            <button type="submit" class="btn btn-primary btn-lg btn-block" style="margin-top: 8px;">Đăng ký tài khoản</button>
        </form>

        <div class="auth-footer">
            Đã có tài khoản? <a th:href="@{/login}">Đăng nhập ngay</a>
            <div style="margin-top: 16px;">
                <a th:href="@{/}" style="color: var(--text-muted); font-size: 0.82rem; transition: color 0.2s;" onmouseover="this.style.color='var(--neon-cyan)'" onmouseout="this.style.color='var(--text-muted)'">
                    ← Quay lại trang chủ
                </a>
            </div>
        </div>
    </div>
</div>

<script th:src="@{/js/main.js}"></script>
</body>
</html>
