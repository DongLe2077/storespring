<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Đăng nhập - Aura</title>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>

<div class="auth-page">
    <div class="auth-card">
        <!-- Logo -->
        <div style="text-align: center; margin-bottom: 20px;">
            <a href="/" class="logo" style="justify-content: center;">
                <img th:src="@{/images/logo.svg}" alt="Aura" style="width: 36px; height: 36px;"/>
                <span>Au<span style="color: var(--neon-cyan);">ra</span></span>
            </a>
        </div>

        <h1>Chào mừng trở lại</h1>
        <p class="auth-subtitle">Đăng nhập để tiếp tục mua sắm</p>

        <!-- Success Message (from Register redirect) -->
        <div class="alert alert-success" th:if="${success}" th:text="${success}"></div>

        <!-- Error Message -->
        <div class="alert alert-error" th:if="${error}" th:text="${error}"></div>

        <form th:action="@{/login}" method="post">
            <input type="hidden" name="redirect" th:value="${redirect}" th:if="${redirect != null}"/>
            <div class="form-group">
                <label>Tên đăng nhập</label>
                <input type="text" class="form-control" name="username" th:value="${loginDTO != null ? loginDTO.username : ''}" placeholder="Nhập tên đăng nhập" required/>
            </div>

            <div class="form-group">
                <label>Mật khẩu</label>
                <input type="password" class="form-control" name="password" placeholder="••••••••" required/>
            </div>

            <button type="submit" class="btn btn-primary btn-lg btn-block" style="margin-top: 8px;">Đăng nhập</button>
        </form>

        <div class="auth-footer">
            Chưa có tài khoản? <a th:href="@{/register}">Đăng ký miễn phí</a>
            <div style="margin-top: 16px;">
                <a th:href="@{/}" style="color: var(--text-muted); font-size: 0.82rem; transition: color 0.2s;" onmouseover="this.style.color='var(--neon-cyan)'" onmouseout="this.style.color='var(--text-muted)'">
                    ← Quay lại trang chủ
                </a>
            </div>
        </div>
    </div>
</div>

<script th:src="@{/js/main.js}"></script>
</body>
</html>
